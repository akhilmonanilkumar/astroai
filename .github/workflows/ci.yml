name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Cache JPL ephemeris
        uses: actions/cache@v4
        with:
          path: backend/data/ephemeris
          key: ephemeris-de440s-c1c7feea

      - name: Fetch JPL ephemeris
        run: uv run python -m guruji fetch-ephemeris

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: backend/data/models
          key: models-paraphrase-multilingual-minilm-l12-v2

      - name: Fetch embedding model
        run: uv run python -m guruji fetch-models

      - name: Tests
        env:
          GURUJI_REQUIRE_EPHEMERIS: "1"
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: uv run pytest -q

      - name: No Swiss Ephemeris in shipped code (AGPL)
        run: |
          if grep -rniE --include="*.py" "swisseph|import swe\b" src/; then
            echo "Swiss Ephemeris (pysweph) may only be used under tests/ as an oracle"; exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f backend/Dockerfile -t guruji-backend:ci .
