[project]
name = "guruji"
version = "0.1.0"
description = "Guruji — personal AI Vedic astrologer on WhatsApp"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "skyfield>=1.55",
    "tzdata>=2026.4",
    "langchain>=1.4.2",
    "langgraph>=1.2.12",
    "langchain-anthropic>=1.7.4",
    "psycopg[binary,pool]>=3.3.6",
    "cryptography>=50.0.1",
    "rapidfuzz>=3.14.6",
    "fastembed>=0.8.1",
    "langchain-openai>=1.6.6",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis[lua]>=2.26",
    "ruff>=0.6",
    "mypy>=1.11",
    "pysweph>=2.10.3.6",
]

[project.scripts]
guruji = "guruji.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guruji"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# Word lists read better as "a b c".split() than as long list literals.
ignore = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["guruji", "conftest"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["guruji"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "skyfield.*", "swisseph"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
